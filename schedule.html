<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スケジュール</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, textarea { width: 100%; margin: 5px 0; padding: 8px; }
    button { padding: 10px; margin-top: 10px; }
    .item { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
  </style>
</head>

<body>

<h1>⚽ スケジュール</h1>

<h2>追加（コーチ用）</h2>

<input id="title" placeholder="タイトル（練習・試合）">
<input id="date" type="date">
<input id="time" placeholder="時間（例：18:00-20:00）">
<input id="place" placeholder="場所">
<textarea id="memo" placeholder="メモ"></textarea>

<button onclick="addSchedule()">追加</button>

<hr>

<h2>一覧</h2>
<div id="list">読み込み中...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 ここだけあなたのFirebaseに差し替え */
const firebaseConfig = {
  apiKey: "AIzaSyA3CIViJgCoyP-WCs_YFAFchlLWKxoFM-Y",
  authDomain: "progresso-ozasa.firebaseapp.com",
  projectId: "progresso-ozasa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 追加 */
window.addSchedule = async function () {
  const title = document.getElementById("title").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const place = document.getElementById("place").value;
  const memo = document.getElementById("memo").value;

  if (!title || !date) {
    alert("タイトルと日付は必須です");
    return;
  }

  try {
    await addDoc(collection(db, "schedules"), {
      title,
      date,
      time,
      place,
      memo,
      createdAt: serverTimestamp()
    });

    alert("追加しました！");
  } catch (e) {
    alert("エラー：" + e.message);
    console.error(e);
  }
};

/* 一覧表示 */
const q = query(collection(db, "schedules"), orderBy("date", "asc"));

onSnapshot(q, (snapshot) => {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (snapshot.empty) {
    list.innerHTML = "まだスケジュールはありません";
    return;
  }

  snapshot.forEach((doc) => {
    const d = doc.data();

    list.innerHTML += `
      <div class="item">
        <b>${d.date || ""} ${d.time || ""}</b><br>
        ⚽ ${d.title || ""}<br>
        📍 ${d.place || ""}<br>
        📝 ${d.memo || ""}
      </div>
    `;
  });
});

</script>

</body>
</html>
