<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スケジュール</title>
</head>
<body>

<h2>スケジュール追加（コーチ用）</h2>

<input id="title" placeholder="タイトル（練習・試合）"><br><br>
<input id="date" type="date"><br><br>
<input id="time" placeholder="時間（例：18:00-20:00）"><br><br>
<input id="place" placeholder="場所"><br><br>
<textarea id="memo" placeholder="メモ"></textarea><br><br>

<button onclick="addSchedule()">追加</button>

<hr>

<h2>スケジュール一覧</h2>
<div id="list">読み込み中...</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3CIViJgCoyP-WCs_YFAFchlLWKxoFM-Y",
  authDomain: "progresso-ozasa.firebaseapp.com",
  projectId: "progresso-ozasa",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* -------------------------
   スケジュール追加
------------------------- */
window.addSchedule = async function () {
  const title = document.getElementById("title").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const place = document.getElementById("place").value;
  const memo = document.getElementById("memo").value;

  if (!title || !date) {
    alert("タイトルと日付は必須です");
    return;
  }

  await addDoc(collection(db, "schedules"), {
    title,
    date,
    time,
    place,
    memo,
    createdAt: serverTimestamp()
  });

  alert("追加しました！");

  document.getElementById("title").value = "";
  document.getElementById("date").value = "";
  document.getElementById("time").value = "";
  document.getElementById("place").value = "";
  document.getElementById("memo").value = "";
};

/* -------------------------
   一覧表示（リアルタイム）
------------------------- */
const q = query(collection(db, "schedules"), orderBy("date", "asc"));

onSnapshot(q, (snapshot) => {
  const list = document.getElementById("list");
  list.innerHTML = "";

  if (snapshot.empty) {
    list.innerHTML = "まだ予定がありません";
    return;
  }

  snapshot.forEach((doc) => {
    const d = doc.data();

    list.innerHTML += `
      <div style="
        border:1px solid #ccc;
        padding:10px;
        margin:10px 0;
        border-radius:8px;
      ">
        <b>📅 ${d.date || ""} ${d.time || ""}</b><br>
        ⚽ ${d.title || ""}<br>
        📍 ${d.place || ""}<br>
        📝 ${d.memo || ""}
      </div>
    `;
  });
});
</script>

</body>
</html>
