<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プログレッソ小笹</title>

<style>
body{
    font-family:sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#0d47a1;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

h2{
    margin-top:0;
}
</style>

</head>
<body>

<header>
    <h1>⚽ プログレッソ小笹</h1>
</header>

<div class="container">

    <div class="card">
        <h2>📢 お知らせ</h2>
        <p>お知らせを表示します</p>
    </div>

    <div class="card">
        <h2>📅 スケジュール</h2>
        <p>スケジュールを表示します</p>
    </div>

    <div class="card">
        <h2>✅ 出欠確認</h2>
        <p>出欠機能を追加予定</p>
    </div>

    <div class="card">
        <h2>💬 保護者連絡</h2>
        <p>チャット機能を追加予定</p>
    </div>

    <div class="card">
        <h2>📷 アルバム</h2>
        <p>写真を表示予定</p>
    </div>

</div>

</body>
</html>
