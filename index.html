<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プログレッソ小笹</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>⚽ プログレッソ小笹</h1>
</header>

<div class="container">
<div class="card">
    <h2>📝 コーチ用お知らせ投稿</h2>
<input
    type="text"
    id="title"
    placeholder="タイトル"
    style="width:100%;padding:10px;margin-bottom:10px;"
>
<textarea
    id="content"
    placeholder="お知らせ内容"
    style="width:100%;height:120px;padding:10px;"
></textarea>
<br><br>
<button id="postBtn">
    投稿する
</button>
<p id="message"></p>
</div>
    <div class="card">
        <h2>📢 お知らせ</h2>
        <div id="announcements">
            お知らせを読み込み中...
        </div>
    </div>

    <div class="card">
        <h2>📅 スケジュール</h2>
        <p>今後実装</p>
    </div>

    <div class="card">
        <h2>✅ 出欠確認</h2>
        <p>今後実装</p>
    </div>

    <div class="card">
        <h2>💬 保護者連絡</h2>
        <p>今後実装</p>
    </div>

    <div class="card">
        <h2>📷 アルバム</h2>
        <p>今後実装</p>
    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
<button onclick="login()">Googleログイン</button>
<button onclick="logout()">ログアウト</button>
